pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    root /site;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location = / { add_header Cache-Control 'no-cache'; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location /community-assets/ { alias /site/; expires 10m; }
    location /nexai-assets/ { alias /site/; expires 10m; }
    location / { return 404; }
  }
}
