pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    absolute_redirect off;
    root /site;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;
    location = /health { return 200 'ok'; }
    location = /lead { return 308 /lead/; }
    location = /lead/nginx.conf { return 404; }
    location /lead/ {
      alias /site/;
      index index.html;
      add_header Cache-Control 'no-cache';
    }
    location / { return 404; }
  }
}
