apiVersion: v1
kind: Namespace
metadata:
  name: lunanexa-runtime-qualification
  labels:
    app.kubernetes.io/part-of: lunanexa
    lunanexa.io/service: runtime-qualification
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-runtime
  namespace: lunanexa-runtime-qualification
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: lunanexa-runtime-qualification
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qualified-runtime-probes
  namespace: lunanexa-runtime-qualification
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: lunanexa
      lunanexa.io/plane: runtime-qualification
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              lunanexa.io/runtime-client: qualification
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 30000
