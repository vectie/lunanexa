# Optional production browser identity resources. The gateway container itself
# is injected into the controller pod by oidc-browser-ingress-controller-patch.yaml
# so signed session exchange reaches the native listener over proven loopback.
# No Secret or credential value belongs in this manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-identity-ingress-config
data:
  LUNANEXA_OIDC_PROVIDER_REF: "${LUNANEXA_OIDC_PROVIDER_REF}"
  LUNANEXA_OIDC_ISSUER_URL: "${LUNANEXA_OIDC_ISSUER_URL}"
  LUNANEXA_OIDC_OPERATOR_REDIRECT_URI: "https://${LUNANEXA_OPERATOR_HOST}/auth/oidc/callback"
  LUNANEXA_OIDC_ENTERPRISE_REDIRECT_URI: "https://${LUNANEXA_ENTERPRISE_HOST}/auth/oidc/callback"
  LUNANEXA_OIDC_ALLOWED_ORIGINS: "https://${LUNANEXA_OPERATOR_HOST},https://${LUNANEXA_ENTERPRISE_HOST}"
  LUNANEXA_LISTEN_ADDRESS: "0.0.0.0:8081"
  LUNANEXA_CONTROL_ENDPOINT: "http://127.0.0.1:8080"
  LUNANEXA_OPERATOR_UPSTREAM: "http://lunanexa-console:8080"
  LUNANEXA_ENTERPRISE_UPSTREAM: "http://lunanexa-enterprise:8080"
  LUNANEXA_WORKBENCH_UPSTREAM: "http://lunanexa-workbench:8080"
  LUNANEXA_OIDC_SCOPES: "openid profile email"
  LUNANEXA_OIDC_PKCE_METHOD: "S256"
  LUNANEXA_OIDC_REQUIRE_STATE: "1"
  LUNANEXA_OIDC_REQUIRE_NONCE: "1"
  LUNANEXA_BROWSER_COOKIE_SECURE: "1"
  LUNANEXA_BROWSER_COOKIE_HTTP_ONLY: "1"
  LUNANEXA_BROWSER_COOKIE_SAME_SITE: "Lax"
  LUNANEXA_OIDC_OPERATOR_COOKIE_NAME: "__Host-lunanexa_operator_oidc"
  LUNANEXA_OIDC_ENTERPRISE_COOKIE_NAME: "__Host-lunanexa_enterprise_oidc"
  LUNANEXA_CSRF_HEADER_NAME: "X-LunaNexa-CSRF"
  LUNANEXA_SESSION_IDLE_TIMEOUT_SECONDS: "1800"
  LUNANEXA_SESSION_ABSOLUTE_TIMEOUT_SECONDS: "28800"
  LUNANEXA_IDENTITY_ASSERTION_MAXIMUM_SECONDS: "30"
  LUNANEXA_IDENTITY_EXCHANGE_PATH: "/v1/auth/session:exchange"
  LUNANEXA_STRIP_REQUEST_HEADERS: "X-LunaNexa-Subject,SSL-Client-Verify,SSL-Client-Subject-DN,X-LunaNexa-Identity-Issuer,X-LunaNexa-Identity-Subject,X-LunaNexa-Identity-Issued-At,X-LunaNexa-Identity-Expires-At,X-LunaNexa-Identity-Nonce,X-LunaNexa-Identity-Signature"
  LUNANEXA_ALLOWED_BROWSER_BEARER_PREFIXES: "lnxs_,lnx_"
---
apiVersion: v1
kind: Service
metadata:
  name: lunanexa-identity-gateway
spec:
  selector:
    app: lunanexa-control
    lunanexa.io/browser-identity-sidecar: enabled
  ports:
    - name: identity-http
      protocol: TCP
      port: 8081
      targetPort: identity-http
---
# Kubernetes policy is pod-scoped, so this overlay grants only the sidecar's
# distinct ingress port and the exact upstreams required by the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-identity-gateway-sidecar
spec:
  podSelector:
    matchLabels:
      app: lunanexa-control
      lunanexa.io/browser-identity-sidecar: enabled
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lunanexa.io/ingress: trusted
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: lunanexa
              lunanexa.io/plane: console
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: lunanexa
              lunanexa.io/plane: enterprise
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: lunanexa
              lunanexa.io/plane: workbench
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              lunanexa.io/service: oidc-provider
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lunanexa-oidc-browser
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${LUNANEXA_OPERATOR_HOST}"
        - "${LUNANEXA_ENTERPRISE_HOST}"
      secretName: lunanexa-oidc-ingress-tls
  rules:
    - host: "${LUNANEXA_OPERATOR_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lunanexa-identity-gateway
                port:
                  number: 8081
    - host: "${LUNANEXA_ENTERPRISE_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lunanexa-identity-gateway
                port:
                  number: 8081
