apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunanexa-control
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: lunanexa-control
  template:
    metadata:
      labels:
        app: lunanexa-control
        app.kubernetes.io/part-of: lunanexa
        lunanexa.io/plane: management
    spec:
      serviceAccountName: lunanexa-control
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: lunanexa-control
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: registry.invalid/lunanexa/control@${CONTROLLER_IMAGE_DIGEST}
          args: []
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LUNANEXA_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: LUNANEXA_STATE_PATH
              value: /var/lib/lunanexa/control.json
            - name: LUNANEXA_REGISTRY_PATH
              value: /var/lib/lunanexa/registry.json
            - name: LUNANEXA_ENROLLMENT_PATH
              value: /var/lib/lunanexa/enrollment.json
            - name: LUNANEXA_SCHEDULER_PATH
              value: /var/lib/lunanexa/scheduler.json
            - name: LUNANEXA_TELEMETRY_PATH
              value: /var/lib/lunanexa/telemetry.json
            - name: LUNANEXA_WORKSPACE_PATH
              value: /var/lib/lunanexa/workspace.json
            - name: LUNANEXA_DEPLOYMENT_PATH
              value: /var/lib/lunanexa/deployments.json
            - name: LUNANEXA_EXCLUSIVE_LEASE_PATH
              value: /var/lib/lunanexa/exclusive-leases.json
            - name: LUNANEXA_EXCLUSIVE_LEASE_RECONCILE_INTERVAL_MS
              value: "30000"
            - name: LUNANEXA_CREDENTIAL_HANDOFF_PATH
              value: /var/lib/lunanexa/credential-handoffs.json
            - name: LUNANEXA_CLIENT_HANDOFF_PATH
              value: /var/lib/lunanexa/client-handoffs.json
            - name: LUNANEXA_CLIENT_ID
              value: desktop-workspace
            - name: LUNANEXA_CLIENT_DISPLAY_NAME
              value: MoonDesk / MoonCode
            - name: LUNANEXA_CLIENT_LAUNCH_URI
              value: http://127.0.0.1:4188/?mode=mooncode
            - name: LUNANEXA_PUBLIC_API_BASE_URL
              value: "${LUNANEXA_PUBLIC_API_BASE_URL}"
            - name: LUNANEXA_CLIENT_HANDOFF_LIFETIME_MS
              value: "120000"
            - name: LUNANEXA_CLIENT_MAXIMUM_REQUESTS
              value: "100000"
            # Optional signed deployment evidence. When absent, external SSH
            # credential issuance stays explicitly pending in /v1/readiness.
            - name: LUNANEXA_CREDENTIAL_ISSUER_READINESS_PATH
              valueFrom:
                secretKeyRef:
                  name: lunanexa-machine-readiness
                  key: credential-issuer-readiness-path
                  optional: true
            - name: LUNANEXA_CREDENTIAL_ISSUER_READINESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-machine-readiness
                  key: credential-issuer-readiness-secret
                  optional: true
            - name: LUNANEXA_CREDENTIAL_ISSUER_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: credential-issuer-adapter-token
                  optional: true
            - name: LUNANEXA_MACHINE_HELPER_READINESS_PATH
              valueFrom:
                secretKeyRef:
                  name: lunanexa-machine-readiness
                  key: machine-helper-readiness-path
                  optional: true
            - name: LUNANEXA_MACHINE_HELPER_READINESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-machine-readiness
                  key: machine-helper-readiness-secret
                  optional: true
            - name: LUNANEXA_MACHINE_HELPER_NODE_SCOPE
              value: "${MACHINE_HELPER_NODE_SCOPE}"
            - name: LUNANEXA_PORTAL_PATH
              value: /var/lib/lunanexa/enterprise-portal.json
            - name: LUNANEXA_NOTIFICATION_PATH
              value: /var/lib/lunanexa/notifications.json
            - name: LUNANEXA_NOTIFICATION_RECONCILE_INTERVAL_MS
              value: "30000"
            # Optional. When absent, `/v1/notifications/operator/readiness`
            # reports AdaptersPending and intrinsic in-app delivery remains
            # available. Do not set a fake provider endpoint in production.
            - name: LUNANEXA_NOTIFICATION_DELIVERY_ADAPTER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: notification-delivery-adapter-endpoint
                  optional: true
            - name: LUNANEXA_NOTIFICATION_DELIVERY_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: notification-delivery-adapter-token
                  optional: true
            - name: LUNANEXA_NOTIFICATION_DELIVERY_INTERVAL_MS
              value: "30000"
            - name: LUNANEXA_NOTIFICATION_DELIVERY_TIMEOUT_MS
              value: "5000"
            # This is an explicit deployment attestation, not endpoint
            # inference. Set to 0 until the collector/export path is verified.
            - name: LUNANEXA_EXTERNAL_OBSERVABILITY_COLLECTOR_CONFIGURED
              value: "0"
            # Required and globally distinct when the collector flag is 1. This
            # authority can only submit downstream export receipts; it is not a
            # metrics or audit reader token.
            - name: LUNANEXA_EXTERNAL_EXPORT_PROOF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: external-export-proof-token
                  optional: true
            - name: LUNANEXA_OFFLINE_COMMERCE_PATH
              value: /var/lib/lunanexa/offline-commerce.json
            - name: LUNANEXA_MACHINE_COMMERCE_PATH
              value: /var/lib/lunanexa/machine-commerce.json
            - name: LUNANEXA_CONTRACT_DOCUMENT_PATH
              value: /var/lib/lunanexa/contract-documents.json
            - name: LUNANEXA_CONTRACT_TEMPLATE_PATH
              value: /usr/share/lunanexa/contracts/youthpolicy/NVIDIA-DGX-Spark-remote-lease-revised.fillable.docx
            - name: LUNANEXA_CONTRACT_DOCUMENT_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: contract-document-worker-token
                  optional: true
            - name: LUNANEXA_ARTIFACT_WORKER_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: artifact-worker-callback-token
            - name: LUNANEXA_ARTIFACT_SCANNER_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: artifact-scanner-callback-token
            - name: LUNANEXA_ENTITLEMENT_AUTHORITY_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: entitlement-authority-callback-token
            - name: LUNANEXA_OFFLINE_TRANSFER_ADAPTER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: offline-transfer-adapter-endpoint
                  optional: true
            - name: LUNANEXA_OFFLINE_TRANSFER_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: offline-transfer-adapter-token
                  optional: true
            - name: LUNANEXA_OFFLINE_TRANSFER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: offline-transfer-session-secret
                  optional: true
            # Remove both readiness variables to run intentionally pending.
            # A configured document is signed deployment evidence, not a set of
            # operator-entered booleans.
            - name: LUNANEXA_OFFLINE_COMMERCE_READINESS_PATH
              value: /etc/lunanexa/offline-readiness/readiness.json
            - name: LUNANEXA_OFFLINE_COMMERCE_READINESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: offline-commerce-readiness-secret
            - name: LUNANEXA_ENABLE_GUIDE_MONITOR
              value: "1"
            - name: LUNANEXA_GUIDE_ORIGIN
              value: "${COURSEBOOK_MONITOR_ORIGIN}"
            - name: LUNANEXA_GUIDE_ALLOW_HTTPS
              value: "1"
            - name: LUNANEXA_GUIDE_ACTOR_REF
              value: service:guide-monitor
            - name: LUNANEXA_GUIDE_TARGET_REF
              value: coursebook-primary
            - name: LUNANEXA_GUIDE_SCHEDULER_PATH
              value: /var/lib/lunanexa/guide-probe.json
            - name: LUNANEXA_GUIDE_PROBE_INTERVAL_MS
              value: "60000"
            - name: LUNANEXA_GUIDE_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: guide-admin-auth-key
            - name: LUNANEXA_GUIDE_OBSERVATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: guide-observation-secret
            - name: LUNANEXA_OBSERVABILITY_PATH
              value: /var/lib/lunanexa/observability.json
            - name: LUNANEXA_ACCESS_PATH
              value: /var/lib/lunanexa/access.json
            - name: LUNANEXA_ACCOUNT_PATH
              value: /var/lib/lunanexa/accounts.json
            - name: LUNANEXA_ACCESS_ONBOARDING_PATH
              value: /var/lib/lunanexa/access-onboarding.json
            - name: LUNANEXA_TECHNICAL_PATH
              value: /var/lib/lunanexa/technical.json
            - name: LUNANEXA_MODEL_SOURCE_ADAPTER_ENDPOINT
              value: http://lunanexa-model-source:8090
            - name: LUNANEXA_MODEL_SOURCE_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-model-source-credentials
                  key: token
            - name: LUNANEXA_EXCLUSIVE_LEASE_PRICE_PER_SECOND_MINOR
              value: "0"
            - name: LUNANEXA_INFERENCE_PRICE_PER_ACCELERATOR_SECOND_MINOR
              value: "0"
            - name: LUNANEXA_INFERENCE_RATE_VERSION
              value: deployment-v1
            - name: LUNANEXA_OPEN_TRIAL_HOURS
              value: "24"
            - name: LUNANEXA_OPEN_TRIAL_MAXIMUM_REQUESTS
              value: "100"
            - name: LUNANEXA_OPEN_TRIAL_ALLOWED_MODELS
              value: text.qwen
            - name: LUNANEXA_BILLING_CURRENCY
              value: CNY
            - name: LUNANEXA_BILLING_SCALE
              value: "2"
            - name: LUNANEXA_PROVIDER_CALLBACK_NAME
              value: qualified-provider
            - name: LUNANEXA_PROVIDER_CALLBACK_ENVIRONMENT
              value: production
            - name: LUNANEXA_PROVIDER_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: provider-callback-secret
            # Machine-only pull authority for payment/signature/identity
            # intents. When absent, management readiness remains red and the
            # customer routes fail closed; the controller never calls a
            # user-supplied provider URL.
            - name: LUNANEXA_COMMERCIAL_PROVIDER_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: commercial-provider-adapter-token
                  optional: true
            - name: LUNANEXA_COMMERCIAL_PROVIDER_ACTION_ORIGIN
              value: "${COMMERCIAL_PROVIDER_ACTION_ORIGIN}"
            - name: LUNANEXA_PERSISTENCE_BACKEND
              value: postgres
            # Production fail-closes unless the supplied endpoint is an
            # independently operated HA PostgreSQL service with verified TLS.
            - name: LUNANEXA_DATABASE_HA_MODE
              value: external-managed
            - name: LUNANEXA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lunanexa-database
                  key: url
            - name: LUNANEXA_CONTROLLER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: LUNANEXA_LEADER_RETRY_MS
              value: "1000"
            - name: LUNANEXA_AVAILABLE_SECRET_REFS
              value: "runtime-token"
            - name: LUNANEXA_REQUIRE_WORKSPACE_LEASE
              value: "1"
            - name: LUNANEXA_RETIRE_BOOTSTRAP_OPERATOR_TOKEN
              value: "1"
            - name: LUNANEXA_ADMIN_SETTINGS_PATH
              value: /etc/lunanexa/admin-policy/admin-settings.json
            - name: LUNANEXA_RECONCILIATION_ONLY
              value: "0"
            - name: LUNANEXA_CONTROLLER_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-control-config
                  key: controller-epoch
            - name: LUNANEXA_RUNTIME_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-control-config
                  key: runtime-endpoint
            - name: LUNANEXA_RUNTIME_ENDPOINTS_PATH
              value: /etc/lunanexa/runtime-routes/endpoints.json
            - name: LUNANEXA_RUNTIME_VERSION
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-control-config
                  key: runtime-version
            - name: LUNANEXA_RUNTIME_IMAGE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-control-config
                  key: runtime-image-digest
            - name: LUNANEXA_MODEL_ARTIFACT_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-control-config
                  key: model-artifact-digest
            - name: LUNANEXA_RUNTIME_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: runtime-token
            - name: LUNANEXA_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: operator-token
            - name: LUNANEXA_INFERENCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: inference-token
            - name: LUNANEXA_AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: audit-token
            - name: LUNANEXA_MONITORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: monitoring-token
            - name: LUNANEXA_ASSIGNMENT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: assignment-signing-secret
            - name: LUNANEXA_CATALOG_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: catalog-signing-secret
            - name: LUNANEXA_MACHINE_COMMERCE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: machine-commerce-signing-secret
            - name: LUNANEXA_EXCLUSIVE_LEASE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: exclusive-lease-signing-secret
            - name: LUNANEXA_CREDENTIAL_HANDOFF_ISSUER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: credential-handoff-issuer-secret
            - name: LUNANEXA_CLIENT_HANDOFF_ISSUER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: client-handoff-issuer-secret
            - name: LUNANEXA_LEASE_HELPER_RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: lease-helper-receipt-secret
            - name: LUNANEXA_GUIDE_DIAGNOSTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: guide-diagnostics-token
            - name: LUNANEXA_API_KEY_ISSUER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: api-key-issuer-secret
            - name: LUNANEXA_ACCOUNT_SESSION_ISSUER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-control-credentials
                  key: account-session-issuer-secret
            # Optional only for the local/static-token profile. The production
            # OIDC profile provisions this key and the controller fails closed
            # for signed identity exchange when it is absent.
            - name: LUNANEXA_IDENTITY_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-identity-ingress-credentials
                  key: identity-assertion-secret
                  optional: true
            - name: LUNANEXA_COSIGN_BINARY
              value: /usr/bin/cosign
            - name: LUNANEXA_COSIGN_PUBLIC_KEY_PATH
              value: /etc/lunanexa/trust/cosign.pub
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/lunanexa
            - name: cosign-trust
              mountPath: /etc/lunanexa/trust
              readOnly: true
            - name: runtime-endpoints
              mountPath: /etc/lunanexa/runtime-routes
              readOnly: true
            - name: admin-settings
              mountPath: /etc/lunanexa/admin-policy
              readOnly: true
            - name: offline-readiness
              mountPath: /etc/lunanexa/offline-readiness
              readOnly: true
            - name: machine-readiness
              mountPath: /etc/lunanexa/machine-readiness
              readOnly: true
      volumes:
        - name: state
          # File paths are development/scratch compatibility only in the
          # PostgreSQL profile. Every authoritative control-plane domain is in
          # PostgreSQL, so replicas never share a ReadWriteOnce PVC.
          emptyDir: {}
        - name: cosign-trust
          secret:
            secretName: lunanexa-cosign-trust
        - name: runtime-endpoints
          configMap:
            name: lunanexa-runtime-endpoints
        - name: admin-settings
          configMap:
            name: lunanexa-admin-settings
        - name: offline-readiness
          secret:
            secretName: lunanexa-offline-commerce-readiness
            defaultMode: 0400
        - name: machine-readiness
          secret:
            secretName: lunanexa-machine-readiness
            optional: true
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: lunanexa-control
spec:
  selector:
    app: lunanexa-control
  ports:
    - name: http
      port: 8080
      targetPort: http
