apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prerequisites.yaml
  - postgres.yaml
  - controller.yaml
  - console.yaml
  - enterprise.yaml
  - workbench.yaml
  - model-source.yaml
  - network-policy.yaml
  - console-public-service.yaml
  - public-sites.yaml
patches:
  - path: prerequisites-patch.yaml
  - path: controller-patch.yaml
  - path: workloads-patch.yaml
  - path: model-source-patch.yaml
  # The management-foundation profile is an explicitly local/development
  # installation with temporary plain-HTTP gateways and static browser tokens.
  # Production overlays must omit this patch and send browser traffic only
  # through lunanexa-identity-gateway.
  - path: network-policy-dev-browser-patch.yaml
    target:
      kind: NetworkPolicy
      name: lunanexa-control
