# The shared public domain runs alongside the existing IP:port services.
# Keep the old routes during the three-site browser acceptance period.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lunanexa-public-docs-strip
  namespace: lunanexa
spec:
  stripPrefix:
    prefixes:
      - /docs
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lunanexa-public-docs-slash
  namespace: lunanexa
spec:
  redirectRegex:
    regex: '^https://suanli\.example\.com/docs$'
    replacement: 'https://suanli.example.com/docs/'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lunanexa-public-docs
  namespace: lunanexa
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`suanli.example.com`) && Path(`/docs`)
      kind: Rule
      middlewares:
        - name: lunanexa-public-docs-slash
      services:
        - name: lunanexa-coursebook-public
          port: 4173
    - match: Host(`suanli.example.com`) && PathPrefix(`/docs/`)
      kind: Rule
      middlewares:
        - name: lunanexa-public-docs-strip
      services:
        - name: lunanexa-coursebook-public
          port: 4173
  tls:
    secretName: lunanexa-public-suanli-tls
