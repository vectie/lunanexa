# Optional DNS-only browser Ingress. The no-domain profile exposes the gateway
# through the deployment's existing IP:port TLS edges instead; Kubernetes
# Ingress host rules cannot contain IP literals or ports.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lunanexa-oidc-browser
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${LUNANEXA_OPERATOR_HOST}"
        - "${LUNANEXA_ENTERPRISE_HOST}"
      secretName: lunanexa-oidc-ingress-tls
  rules:
    - host: "${LUNANEXA_OPERATOR_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lunanexa-identity-gateway
                port:
                  number: 8081
    - host: "${LUNANEXA_ENTERPRISE_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lunanexa-identity-gateway
                port:
                  number: 8081
