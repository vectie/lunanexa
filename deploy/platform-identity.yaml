# LunaNexa-operated public identity provider. This profile requires the
# Keycloak 26.7.3 Operator CRDs and a deployment-owned Secret set generated by
# scripts/deploy/generate-platform-identity-secrets.sh. No credential value is
# stored in this source manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    lunanexa.io/service: oidc-provider
    lunanexa.io/managed-profile: platform-identity
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: lunanexa-platform-idp
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    app.kubernetes.io/name: lunanexa-platform-idp
    app.kubernetes.io/part-of: lunanexa
spec:
  instances: 2
  image: "${KEYCLOAK_IMAGE}"
  startOptimized: false
  db:
    vendor: postgres
    host: "${LUNANEXA_IDENTITY_DATABASE_HOST}"
    port: 5432
    database: "${LUNANEXA_IDENTITY_DATABASE_NAME}"
    usernameSecret:
      name: lunanexa-platform-idp-database
      key: username
    passwordSecret:
      name: lunanexa-platform-idp-database
      key: password
    poolInitialSize: 5
    poolMinSize: 5
    poolMaxSize: 30
  http:
    httpEnabled: false
    httpsPort: 8443
    tlsSecret: lunanexa-platform-idp-tls
  hostname:
    hostname: "https://${LUNANEXA_IDENTITY_HOST}"
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  additionalOptions:
    - name: http-max-queued-requests
      value: "1000"
    - name: log-console-output
      value: json
    - name: metrics-enabled
      value: "true"
    - name: health-enabled
      value: "true"
  resources:
    requests:
      cpu: "500m"
      memory: "1250Mi"
    limits:
      cpu: "2"
      memory: "2250Mi"
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lunanexa-public-v1
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    app.kubernetes.io/name: lunanexa-platform-idp
    app.kubernetes.io/part-of: lunanexa
spec:
  keycloakCRName: lunanexa-platform-idp
  placeholders:
    LUNANEXA_OPERATOR_CLIENT_SECRET:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: operator-client-secret
    LUNANEXA_ENTERPRISE_CLIENT_SECRET:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: enterprise-client-secret
    LUNANEXA_SMTP_HOST:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-host
    LUNANEXA_SMTP_PORT:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-port
    LUNANEXA_SMTP_USERNAME:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-username
    LUNANEXA_SMTP_PASSWORD:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-password
    LUNANEXA_SMTP_FROM:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-from
  realm:
    realm: lunanexa
    displayName: LunaNexa
    enabled: true
    sslRequired: external
    registrationAllowed: true
    registrationEmailAsUsername: true
    editUsernameAllowed: false
    resetPasswordAllowed: true
    rememberMe: true
    verifyEmail: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 5
    waitIncrementSeconds: 60
    quickLoginCheckMilliSeconds: 1000
    minimumQuickLoginWaitSeconds: 60
    maxFailureWaitSeconds: 900
    maxDeltaTimeSeconds: 43200
    passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername(undefined) and notEmail(undefined) and passwordHistory(5)"
    defaultSignatureAlgorithm: RS256
    accessTokenLifespan: 300
    accessCodeLifespan: 60
    accessCodeLifespanLogin: 600
    actionTokenGeneratedByUserLifespan: 600
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 28800
    clientSessionIdleTimeout: 1800
    clientSessionMaxLifespan: 28800
    offlineSessionIdleTimeout: 2592000
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    internationalizationEnabled: true
    supportedLocales:
      - en
      - zh-CN
    defaultLocale: zh-CN
    eventsEnabled: true
    eventsExpiration: 2592000
    enabledEventTypes:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - REGISTER
      - REGISTER_ERROR
      - VERIFY_EMAIL
      - VERIFY_EMAIL_ERROR
      - UPDATE_PASSWORD
      - UPDATE_PASSWORD_ERROR
      - UPDATE_TOTP
      - UPDATE_TOTP_ERROR
      - REMOVE_TOTP
      - REMOVE_TOTP_ERROR
      - RESET_PASSWORD
      - RESET_PASSWORD_ERROR
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    smtpServer:
      host: "${LUNANEXA_SMTP_HOST}"
      port: "${LUNANEXA_SMTP_PORT}"
      from: "${LUNANEXA_SMTP_FROM}"
      auth: "true"
      user: "${LUNANEXA_SMTP_USERNAME}"
      password: ${LUNANEXA_SMTP_PASSWORD}
      starttls: "true"
      ssl: "false"
    requiredActions:
      - alias: VERIFY_EMAIL
        name: Verify Email
        providerId: VERIFY_EMAIL
        enabled: true
        defaultAction: false
        priority: 10
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: true
        priority: 20
      - alias: UPDATE_PASSWORD
        name: Update Password
        providerId: UPDATE_PASSWORD
        enabled: true
        defaultAction: false
        priority: 30
      - alias: UPDATE_PROFILE
        name: Update Profile
        providerId: UPDATE_PROFILE
        enabled: true
        defaultAction: false
        priority: 40
    clients:
      - clientId: lunanexa-operator
        name: LunaNexa Operator Console
        enabled: true
        publicClient: false
        secret: ${LUNANEXA_OPERATOR_CLIENT_SECRET}
        protocol: openid-connect
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: false
        consentRequired: false
        rootUrl: "https://${LUNANEXA_OPERATOR_HOST}"
        baseUrl: "https://${LUNANEXA_OPERATOR_HOST}/"
        redirectUris:
          - "https://${LUNANEXA_OPERATOR_HOST}/auth/oidc/callback"
        webOrigins:
          - "https://${LUNANEXA_OPERATOR_HOST}"
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://${LUNANEXA_OPERATOR_HOST}/"
        defaultClientScopes:
          - profile
          - email
      - clientId: lunanexa-enterprise
        name: LunaNexa Enterprise Portal
        enabled: true
        publicClient: false
        secret: ${LUNANEXA_ENTERPRISE_CLIENT_SECRET}
        protocol: openid-connect
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: false
        consentRequired: false
        rootUrl: "https://${LUNANEXA_ENTERPRISE_HOST}"
        baseUrl: "https://${LUNANEXA_ENTERPRISE_HOST}/"
        redirectUris:
          - "https://${LUNANEXA_ENTERPRISE_HOST}/auth/oidc/callback"
        webOrigins:
          - "https://${LUNANEXA_ENTERPRISE_HOST}"
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://${LUNANEXA_ENTERPRISE_HOST}/"
        defaultClientScopes:
          - profile
          - email
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lunanexa-platform-idp
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: lunanexa-platform-idp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-platform-idp-ingress
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  podSelector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: lunanexa-platform-idp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lunanexa.io/ingress: trusted
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${LUNANEXA_MANAGEMENT_NAMESPACE}"
          podSelector:
            matchLabels:
              app: lunanexa-identity-gateway
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
              app.kubernetes.io/instance: lunanexa-platform-idp
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-identity-gateway-to-platform-idp
  namespace: "${LUNANEXA_MANAGEMENT_NAMESPACE}"
spec:
  podSelector:
    matchLabels:
      app: lunanexa-identity-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${LUNANEXA_IDENTITY_NAMESPACE}"
          podSelector:
            matchLabels:
              app: keycloak
              app.kubernetes.io/instance: lunanexa-platform-idp
      ports:
        - protocol: TCP
          port: 8443
    # The OIDC issuer is an HTTPS public origin. Pin its reviewed ingress or
    # load-balancer address instead of granting the gateway arbitrary Internet
    # egress. A split-horizon deployment may route through the pod rule above.
    - to:
        - ipBlock:
            cidr: "${LUNANEXA_IDENTITY_EGRESS_CIDR}"
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lunanexa-platform-idp-public
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${LUNANEXA_IDENTITY_HOST}"
      secretName: lunanexa-platform-idp-tls
  rules:
    - host: "${LUNANEXA_IDENTITY_HOST}"
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: lunanexa-platform-idp-service
                port:
                  number: 8443
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: lunanexa-platform-idp-service
                port:
                  number: 8443
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: lunanexa-platform-idp-service
                port:
                  number: 8443
