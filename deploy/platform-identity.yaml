---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lunanexa-identity-internal-edge
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lunanexa-identity-internal-edge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-platform-idp-ingress
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  podSelector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: lunanexa-platform-idp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lunanexa-identity-internal-edge
        - podSelector:
            matchLabels:
              app: lunanexa-identity-public-edge
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
              app.kubernetes.io/instance: lunanexa-platform-idp
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-identity-public-edge
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  podSelector:
    matchLabels:
      app: lunanexa-identity-public-edge
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
              app.kubernetes.io/instance: lunanexa-platform-idp
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
