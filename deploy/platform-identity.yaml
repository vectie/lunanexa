# LunaNexa-operated public identity provider. This profile requires the
# Keycloak 26.7.3 Operator CRDs, deployment-owned TLS/CA Secrets, and the
# credential Secret set generated by
# scripts/deploy/generate-platform-identity-secrets.sh. No credential,
# certificate, or private-key value is stored in this source manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    lunanexa.io/service: oidc-provider
    lunanexa.io/managed-profile: platform-identity
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: lunanexa-platform-idp
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    app.kubernetes.io/name: lunanexa-platform-idp
    app.kubernetes.io/part-of: lunanexa
spec:
  instances: 2
  image: "${KEYCLOAK_IMAGE}"
  startOptimized: false
  db:
    vendor: postgres
    host: "${LUNANEXA_IDENTITY_DATABASE_HOST}"
    port: 5432
    database: "${LUNANEXA_IDENTITY_DATABASE_NAME}"
    usernameSecret:
      name: lunanexa-platform-idp-database
      key: username
    passwordSecret:
      name: lunanexa-platform-idp-database
      key: password
    poolInitialSize: 5
    poolMinSize: 5
    poolMaxSize: 30
  http:
    httpEnabled: false
    httpsPort: 8443
    # This certificate is only for the cluster-local Keycloak Service name.
    # Never reuse the public issuer certificate for this backend connection.
    tlsSecret: lunanexa-platform-idp-internal-tls
  hostname:
    hostname: "https://${LUNANEXA_IDENTITY_HOST}"
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  additionalOptions:
    - name: http-max-queued-requests
      value: "1000"
    - name: log-console-output
      value: json
    - name: metrics-enabled
      value: "true"
    - name: health-enabled
      value: "true"
  resources:
    requests:
      cpu: "500m"
      memory: "1250Mi"
    limits:
      cpu: "2"
      memory: "2250Mi"
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lunanexa-public-v1
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    app.kubernetes.io/name: lunanexa-platform-idp
    app.kubernetes.io/part-of: lunanexa
spec:
  keycloakCRName: lunanexa-platform-idp
  placeholders:
    LUNANEXA_OPERATOR_CLIENT_SECRET:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: operator-client-secret
    LUNANEXA_ENTERPRISE_CLIENT_SECRET:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: enterprise-client-secret
    LUNANEXA_SMTP_HOST:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-host
    LUNANEXA_SMTP_PORT:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-port
    LUNANEXA_SMTP_USERNAME:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-username
    LUNANEXA_SMTP_PASSWORD:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-password
    LUNANEXA_SMTP_FROM:
      secret:
        name: lunanexa-platform-idp-realm-secrets
        key: smtp-from
  realm:
    realm: lunanexa
    displayName: LunaNexa
    enabled: true
    sslRequired: external
    registrationAllowed: true
    registrationEmailAsUsername: true
    editUsernameAllowed: false
    resetPasswordAllowed: true
    rememberMe: true
    verifyEmail: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 5
    waitIncrementSeconds: 60
    quickLoginCheckMilliSeconds: 1000
    minimumQuickLoginWaitSeconds: 60
    maxFailureWaitSeconds: 900
    maxDeltaTimeSeconds: 43200
    passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername(undefined) and notEmail(undefined) and passwordHistory(5)"
    defaultSignatureAlgorithm: RS256
    accessTokenLifespan: 300
    accessCodeLifespan: 60
    accessCodeLifespanLogin: 600
    actionTokenGeneratedByUserLifespan: 600
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 28800
    clientSessionIdleTimeout: 1800
    clientSessionMaxLifespan: 28800
    offlineSessionIdleTimeout: 2592000
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    internationalizationEnabled: true
    supportedLocales:
      - en
      - zh-CN
    defaultLocale: zh-CN
    eventsEnabled: true
    eventsExpiration: 2592000
    enabledEventTypes:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - REGISTER
      - REGISTER_ERROR
      - VERIFY_EMAIL
      - VERIFY_EMAIL_ERROR
      - UPDATE_PASSWORD
      - UPDATE_PASSWORD_ERROR
      - UPDATE_TOTP
      - UPDATE_TOTP_ERROR
      - REMOVE_TOTP
      - REMOVE_TOTP_ERROR
      - RESET_PASSWORD
      - RESET_PASSWORD_ERROR
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    smtpServer:
      host: "${LUNANEXA_SMTP_HOST}"
      port: "${LUNANEXA_SMTP_PORT}"
      from: "${LUNANEXA_SMTP_FROM}"
      auth: "true"
      user: "${LUNANEXA_SMTP_USERNAME}"
      password: ${LUNANEXA_SMTP_PASSWORD}
      starttls: "true"
      ssl: "false"
    requiredActions:
      - alias: VERIFY_EMAIL
        name: Verify Email
        providerId: VERIFY_EMAIL
        enabled: true
        defaultAction: false
        priority: 10
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: true
        priority: 20
      - alias: UPDATE_PASSWORD
        name: Update Password
        providerId: UPDATE_PASSWORD
        enabled: true
        defaultAction: false
        priority: 30
      - alias: UPDATE_PROFILE
        name: Update Profile
        providerId: UPDATE_PROFILE
        enabled: true
        defaultAction: false
        priority: 40
    clients:
      - clientId: lunanexa-operator
        name: LunaNexa Operator Console
        enabled: true
        publicClient: false
        secret: ${LUNANEXA_OPERATOR_CLIENT_SECRET}
        protocol: openid-connect
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: false
        consentRequired: false
        rootUrl: "https://${LUNANEXA_OPERATOR_HOST}"
        baseUrl: "https://${LUNANEXA_OPERATOR_HOST}/"
        redirectUris:
          - "https://${LUNANEXA_OPERATOR_HOST}/auth/oidc/callback"
        webOrigins:
          - "https://${LUNANEXA_OPERATOR_HOST}"
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://${LUNANEXA_OPERATOR_HOST}/"
        defaultClientScopes:
          - profile
          - email
        protocolMappers:
          - name: lunanexa-operator-access-token-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: lunanexa-operator
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"
      - clientId: lunanexa-enterprise
        name: LunaNexa Enterprise Portal
        enabled: true
        publicClient: false
        secret: ${LUNANEXA_ENTERPRISE_CLIENT_SECRET}
        protocol: openid-connect
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: false
        consentRequired: false
        rootUrl: "https://${LUNANEXA_ENTERPRISE_HOST}"
        baseUrl: "https://${LUNANEXA_ENTERPRISE_HOST}/"
        redirectUris:
          - "https://${LUNANEXA_ENTERPRISE_HOST}/auth/oidc/callback"
        webOrigins:
          - "https://${LUNANEXA_ENTERPRISE_HOST}"
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://${LUNANEXA_ENTERPRISE_HOST}/"
        defaultClientScopes:
          - profile
          - email
        protocolMappers:
          - name: lunanexa-enterprise-access-token-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: lunanexa-enterprise
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
              lightweight.claim: "false"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lunanexa-platform-idp
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: lunanexa-platform-idp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-identity-public-edge-nginx
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name _;
      absolute_redirect off;
      server_tokens off;

      ssl_certificate /etc/lunanexa/public-tls/tls.crt;
      ssl_certificate_key /etc/lunanexa/public-tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_tickets off;

      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      location = / {
        return 302 /realms/lunanexa/account/;
      }

      location ^~ /realms/lunanexa/ {
        proxy_pass https://lunanexa-platform-idp-service:8443;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host ${LUNANEXA_IDENTITY_HOST};
        proxy_set_header X-Forwarded-Host ${LUNANEXA_IDENTITY_HOST};
        proxy_set_header X-Forwarded-Port ${LUNANEXA_IDENTITY_PORT};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_trusted_certificate /etc/lunanexa/upstream-ca/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name lunanexa-platform-idp-service.${LUNANEXA_IDENTITY_NAMESPACE}.svc.cluster.local;
        proxy_ssl_server_name on;
      }

      location ^~ /resources/ {
        proxy_pass https://lunanexa-platform-idp-service:8443;
        proxy_http_version 1.1;
        proxy_set_header Host ${LUNANEXA_IDENTITY_HOST};
        proxy_set_header X-Forwarded-Host ${LUNANEXA_IDENTITY_HOST};
        proxy_set_header X-Forwarded-Port ${LUNANEXA_IDENTITY_PORT};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_trusted_certificate /etc/lunanexa/upstream-ca/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name lunanexa-platform-idp-service.${LUNANEXA_IDENTITY_NAMESPACE}.svc.cluster.local;
        proxy_ssl_server_name on;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunanexa-identity-public-edge
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
  labels:
    app: lunanexa-identity-public-edge
    app.kubernetes.io/part-of: lunanexa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lunanexa-identity-public-edge
  template:
    metadata:
      labels:
        app: lunanexa-identity-public-edge
        app.kubernetes.io/part-of: lunanexa
        lunanexa.io/plane: public-identity-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: "${IDENTITY_EDGE_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: public-tls
              mountPath: /etc/lunanexa/public-tls
              readOnly: true
            - name: upstream-ca
              mountPath: /etc/lunanexa/upstream-ca
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: lunanexa-identity-public-edge-nginx
        - name: public-tls
          secret:
            secretName: lunanexa-platform-idp-tls
        - name: upstream-ca
          secret:
            secretName: lunanexa-oidc-internal-ca
            items:
              - key: ca.pem
                path: ca.pem
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lunanexa-identity-public
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  type: LoadBalancer
  selector:
    app: lunanexa-identity-public-edge
  ports:
    - name: https
      protocol: TCP
      port: ${LUNANEXA_IDENTITY_PORT}
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lunanexa-identity-public-edge
  namespace: "${LUNANEXA_IDENTITY_NAMESPACE}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lunanexa-identity-public-edge
---
