    matchLabels:
      app: lunanexa-identity-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${LUNANEXA_IDENTITY_NAMESPACE}"
          podSelector:
            matchLabels:
              app: lunanexa-identity-internal-edge
      ports:
        - protocol: TCP
          port: 8443
