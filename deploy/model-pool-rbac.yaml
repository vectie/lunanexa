# Only model services approved for existing-instance adoption. No create/delete,
# workload exec, Secret reads or cluster-wide model-service permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lunanexa-trial-model-pool
  namespace: lunanexa
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [event-qwen-176, qwen3-llm, event-qwen-178, event-qwen-179, minimaxh3-fl2va]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lunanexa-trial-model-pool
  namespace: lunanexa
subjects:
  - kind: ServiceAccount
    name: lunanexa-control
    namespace: lunanexa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lunanexa-trial-model-pool
