apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lunanexa-offline-approved-fonts
  namespace: lunanexa
  labels:
    app.kubernetes.io/part-of: lunanexa
    lunanexa.io/offline-font-profile: noto-sans-sc-ofl-v2
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
# Populate once on the management node with the verified OFL bundle. Runtime
# Jobs mount this claim readOnly at /fonts; manifest.json names the exact font.
# Do not overwrite a live profile in place: use a new claim for a font upgrade.
