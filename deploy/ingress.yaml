apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lunanexa
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: "${LUNANEXA_NAMESPACE}/lunanexa-client-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  tls:
    - hosts: [lunanexa.invalid, enterprise.lunanexa.invalid]
      secretName: lunanexa-ingress-tls
  rules:
    - host: lunanexa.invalid
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: lunanexa-control
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: lunanexa-control
                port:
                  number: 8080
          - path: /version
            pathType: Exact
            backend:
              service:
                name: lunanexa-control
                port:
                  number: 8080
          - path: /workbench
            pathType: Prefix
            backend:
              service:
                name: lunanexa-workbench
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lunanexa-console
                port:
                  number: 8080
    - host: enterprise.lunanexa.invalid
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: lunanexa-control
                port:
                  number: 8080
          - path: /workbench
            pathType: Prefix
            backend:
              service:
                name: lunanexa-enterprise
                port:
                  number: 8080
          - path: /enterprise
            pathType: Prefix
            backend:
              service:
                name: lunanexa-enterprise
                port:
                  number: 8080
