apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-control-to-enterprise-glm53
  namespace: lunanexa
spec:
  podSelector:
    matchLabels:
      app: lunanexa-control
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.2.178/32
      ports:
        - protocol: TCP
          port: 8888
    - to:
        - ipBlock:
            cidr: 192.168.2.175/32
      ports:
        - protocol: TCP
          port: 5907
