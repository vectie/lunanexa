apiVersion: v1
kind: Namespace
metadata:
  name: lunanexa-storage-probe-20260923
  labels:
    app.kubernetes.io/part-of: lunanexa-storage-probe
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cross-spark-probe
  namespace: lunanexa-storage-probe-20260923
  labels:
    app.kubernetes.io/part-of: lunanexa-storage-probe
spec:
  accessModes: [ReadWriteMany]
  storageClassName: lunanexa-workspaces-rwx
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer-25e2
  namespace: lunanexa-storage-probe-20260923
  labels:
    app.kubernetes.io/part-of: lunanexa-storage-probe
spec:
  nodeSelector:
    kubernetes.io/hostname: spark-25e2-3d35c8fd
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: lunanexa-registry.lunanexa-registry.svc.cluster.local:5000/acceptance/gpu-terminal@sha256:aae41c0b6c7d63b5ed7d03b2043fbb9707fb72f9430167d22b66b1b314b219f6
      imagePullPolicy: IfNotPresent
      command: [/bin/sleep, "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      volumeMounts:
        - name: shared
          mountPath: /workspace
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: cross-spark-probe
---
