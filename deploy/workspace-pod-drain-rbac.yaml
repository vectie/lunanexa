# Render placeholders with the deployment's namespace and gateway account.
# Additive reader permission for safe single-writer workspace restart/drain.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webide-pod-drain-reader
  namespace: ${WORKSPACE_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webide-pod-drain-reader
  namespace: ${WORKSPACE_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webide-pod-drain-reader
subjects:
  - kind: ServiceAccount
    name: ${WEBIDE_GATEWAY_SERVICE_ACCOUNT}
    namespace: ${WORKSPACE_NAMESPACE}
