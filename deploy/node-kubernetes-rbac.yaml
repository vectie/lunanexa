# What the node agent needs in order to start a runtime through the Kubernetes
# API, and nothing more.
#
# The ServiceAccount is deliberately not created here: it is `lunanexa-node`,
# the same one deploy/prerequisites.yaml creates and the same one the agent
# pods run as. One identity per plane, so a runtime can never be started by
# anything that is not the agent that owns that node.
#
# deploy/cluster/one-click.sh renders ${NAMESPACE} and ${RUNTIME_NAMESPACE}
# from deploy/cluster/cluster.json. There is one runtime namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ${RUNTIME_NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: lunanexa
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ${RUNTIME_NAMESPACE}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Only pods in the runtime namespace, and only these verbs. The agent's
# projected token is never mounted into a serving container.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lunanexa-node-runtime
  namespace: ${RUNTIME_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaimtemplates]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lunanexa-node-runtime
  namespace: ${RUNTIME_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lunanexa-node-runtime
subjects:
  - kind: ServiceAccount
    name: lunanexa-node
    namespace: ${NAMESPACE}
