# Shared-domain front door for both public HTTPS ports (443 and 8443).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-mana-strip, namespace: lunanexa}
spec:
  stripPrefix: {prefixes: [/mana]}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-user-strip, namespace: lunanexa}
spec:
  stripPrefix: {prefixes: [/user]}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-console-prefix, namespace: lunanexa}
spec:
  addPrefix: {prefix: /console}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-enterprise-prefix, namespace: lunanexa}
spec:
  addPrefix: {prefix: /enterprise}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-mana-slash, namespace: lunanexa}
spec:
  redirectRegex:
    regex: '^https://suanli\.example\.com(:8443)?/mana$'
    replacement: 'https://suanli.example.com${1}/mana/'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: lunanexa-public-user-slash, namespace: lunanexa}
spec:
  redirectRegex:
    regex: '^https://suanli\.example\.com(:8443)?/user$'
    replacement: 'https://suanli.example.com${1}/user/'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lunanexa-public-workbench, namespace: lunanexa}
spec:
  podSelector:
    matchLabels: {app: lunanexa-workbench}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: lunanexa-public-apps, namespace: lunanexa}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`suanli.example.com`) && Path(`/mana`)
      kind: Rule
      priority: 110
      middlewares: [{name: lunanexa-public-mana-slash}]
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    - match: Host(`suanli.example.com`) && Path(`/user`)
      kind: Rule
      priority: 110
      middlewares: [{name: lunanexa-public-user-slash}]
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    - match: Host(`suanli.example.com`) && (PathPrefix(`/mana/auth/`) || PathPrefix(`/mana/v1/`))
      kind: Rule
      priority: 100
      middlewares: [{name: lunanexa-public-mana-strip}]
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    - match: Host(`suanli.example.com`) && (PathPrefix(`/user/auth/`) || PathPrefix(`/user/v1/`))
      kind: Rule
      priority: 100
      middlewares: [{name: lunanexa-public-user-strip}]
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    - match: Host(`suanli.example.com`) && PathPrefix(`/mana/`)
      kind: Rule
      priority: 20
      middlewares:
        - {name: lunanexa-public-mana-strip}
        - {name: lunanexa-public-console-prefix}
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    # Static workbench shell belongs to the customer site. Session bootstrap
    # and all authenticated requests still use /user/auth and /user/v1 above.
    - match: Host(`suanli.example.com`) && PathPrefix(`/user/workbench/`)
      kind: Rule
      priority: 90
      middlewares: [{name: lunanexa-public-user-strip}]
      services: [{name: lunanexa-workbench, port: 8080}]
    - match: Host(`suanli.example.com`) && PathPrefix(`/user/`)
      kind: Rule
      priority: 20
      middlewares:
        - {name: lunanexa-public-user-strip}
        - {name: lunanexa-public-enterprise-prefix}
      services: [{name: lunanexa-identity-gateway-suanli, port: 8081}]
    - match: Host(`suanli.example.com`) && PathPrefix(`/mana/assets/`)
      kind: Rule
      priority: 90
      middlewares: [{name: lunanexa-public-mana-strip}]
      services: [{name: lunanexa-enterprise, port: 8080}]
    - match: Host(`suanli.example.com`) && PathPrefix(`/user/assets/`)
      kind: Rule
      priority: 90
      middlewares: [{name: lunanexa-public-user-strip}]
      services: [{name: lunanexa-enterprise, port: 8080}]
  tls:
    secretName: lunanexa-public-suanli-tls
