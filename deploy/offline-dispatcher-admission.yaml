# Job creation is indirectly privileged. Bind this policy to the exact dispatcher
# identity; labels alone are not a security boundary because callers choose them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: lunanexa-offline-artifact-jobs}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  matchConditions:
    - name: dispatcher-identity
      expression: request.userInfo.username == 'system:serviceaccount:lunanexa:lunanexa-offline-artifact-dispatcher'
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: containers
      expression: variables.pod.containers + variables.pod.initContainers
  validations:
    - expression: >-
        object.metadata.namespace == 'lunanexa' &&
        object.metadata.name.matches('^offline-artifact-[a-f0-9]{40}$') &&
        object.spec.template.metadata.labels['app'] == 'lunanexa-offline-artifact-job'
      message: Only isolated artifact Jobs may be created.
    - expression: >-
        variables.pod.automountServiceAccountToken == false &&
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        (!has(variables.pod.shareProcessNamespace) || !variables.pod.shareProcessNamespace) &&
        (!has(variables.pod.imagePullSecrets) || size(variables.pod.imagePullSecrets) == 0) &&
        variables.pod.securityContext.runAsNonRoot &&
        variables.pod.securityContext.runAsUser == 65532 &&
        variables.pod.securityContext.runAsGroup == 65532 &&
        variables.pod.securityContext.fsGroup == 65532 &&
        variables.pod.securityContext.seccompProfile.type == 'Localhost' &&
        variables.pod.securityContext.seccompProfile.localhostProfile == 'lunanexa/offline-worker.json'
      message: Artifact Jobs require tokenless non-root isolated execution.
    - expression: >-
        size(variables.pod.containers) == 1 && size(variables.pod.initContainers) == 2 &&
        variables.pod.initContainers[0].name == 'prepare' &&
        variables.pod.initContainers[0].command == ['/usr/local/bin/offline-artifact-worker'] &&
        variables.pod.initContainers[1].name == 'render' &&
        variables.pod.initContainers[1].command == ['/usr/local/bin/offline-pdf-renderer'] &&
        variables.pod.containers[0].name == 'finalize' &&
        variables.pod.containers[0].command == ['/usr/local/bin/offline-artifact-worker'] &&
        variables.containers.all(c, c.image == 'REPLACE_WITH_OFFLINE_DISPATCHER_IMAGE_DIGEST' &&
          (!has(c.args) || size(c.args) == 0) &&
          (!has(c.envFrom) || size(c.envFrom) == 0) &&
          (!has(c.lifecycle)) && !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) &&
          (!has(c.volumeDevices) || size(c.volumeDevices) == 0) &&
          (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser == 65532) &&
          (!has(c.securityContext.runAsGroup) || c.securityContext.runAsGroup == 65532) &&
          (!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot) &&
          !has(c.securityContext.seccompProfile) &&
          (!has(c.securityContext.procMount) || c.securityContext.procMount == 'Default') &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          !c.securityContext.allowPrivilegeEscalation && c.securityContext.readOnlyRootFilesystem &&
          c.securityContext.capabilities.drop == ['ALL'] &&
          (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: Only the approved immutable prepare/render/finalize executables are allowed.
    - expression: >-
        size(variables.pod.volumes) == 3 && variables.pod.volumes.all(v,
          (v.name == 'work' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'lunanexa-offline-dispatcher-state') ||
          (v.name == 'fonts' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'lunanexa-offline-approved-fonts') ||
          (v.name == 'tmp' && has(v.emptyDir))) &&
        variables.containers.all(c, size(c.volumeMounts) == 3 && c.volumeMounts.all(m,
          (m.name == 'work' && m.mountPath == '/job' && has(m.subPath) && m.subPath.matches('^artifact/[a-f0-9]{64}$')) ||
          (m.name == 'fonts' && m.mountPath == '/fonts' && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) ||
          (m.name == 'tmp' && m.mountPath == '/tmp' && !has(m.subPath) && !has(m.subPathExpr))))
      message: Only the bounded request directory, approved fonts and ephemeral scratch may be mounted.
    - expression: >-
        variables.containers.all(c, c.env.all(e,
          (e.name == 'LUNANEXA_OFFLINE_ARTIFACT_STAGING_ROOT' && e.value == '/job') ||
          (e.name == 'LUNANEXA_OFFLINE_ARTIFACT_JOB_FILENAME' && e.value == 'job.json') ||
          (e.name == 'LUNANEXA_OFFLINE_FONT_ROOT' && e.value == '/fonts') ||
          (e.name == 'LUNANEXA_OFFLINE_FONT_CONFIG_FILENAME' && e.value == '/fonts/manifest.json') ||
          (e.name == 'LUNANEXA_OFFLINE_ARTIFACT_MODE' && e.value == c.name) ||
          (e.name == 'LUNANEXA_RENDER_EVIDENCE_SECRET' && c.name != 'prepare' &&
            has(e.valueFrom) && has(e.valueFrom.secretKeyRef) &&
            e.valueFrom.secretKeyRef.name == 'lunanexa-offline-render-evidence' &&
            e.valueFrom.secretKeyRef.key == 'LUNANEXA_RENDER_EVIDENCE_SECRET')))
      message: Worker environment cannot expose controller or object-store credentials.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: lunanexa-offline-artifact-jobs}
spec:
  policyName: lunanexa-offline-artifact-jobs
  validationActions: [Deny]
