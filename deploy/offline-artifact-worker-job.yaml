# Single-stage template for non-PDF OOXML generation. PDF work uses
# offline-pdf-pipeline-job.yaml. The external dispatcher owns staging, output
# upload, terminal callback acknowledgement, and per-job PVC deletion.
apiVersion: batch/v1
kind: Job
metadata:
  name: lunanexa-offline-artifact-worker-${JOB_ID}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: lunanexa
        lunanexa.io/plane: management
        lunanexa.io/component: offline-artifact-worker
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.invalid/lunanexa/control@${CONTROLLER_IMAGE_DIGEST}
          command: ["/usr/local/bin/lunanexa-offline-artifact-worker"]
          env:
            - name: LUNANEXA_OFFLINE_ARTIFACT_STAGING_ROOT
              value: /work
            - name: LUNANEXA_OFFLINE_ARTIFACT_JOB_FILENAME
              value: ${JOB_FILENAME}
            - name: LUNANEXA_OFFLINE_ARTIFACT_MODE
              value: ${ARTIFACT_MODE}
            - name: LUNANEXA_RENDER_EVIDENCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunanexa-offline-artifact-worker
                  key: render-evidence-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: staging
              mountPath: /work
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: lunanexa-offline-artifact-${JOB_ID}
