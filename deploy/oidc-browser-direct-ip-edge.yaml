# Direct-IP browser TLS edge. This profile is rendered only when the operator
# and enterprise authorities are the same IPv4 address on ports 5003 and 5005.
# TLS key material remains in the deployment-owned Secret referenced below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-identity-edge-nginx
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name _;
      server_tokens off;

      ssl_certificate /etc/lunanexa/tls/tls.crt;
      ssl_certificate_key /etc/lunanexa/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_tickets off;

      client_max_body_size 1m;

      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;

      location / {
        proxy_pass http://lunanexa-identity-gateway:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunanexa-identity-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lunanexa-identity-edge
  template:
    metadata:
      labels:
        app: lunanexa-identity-edge
        app.kubernetes.io/part-of: lunanexa
        lunanexa.io/plane: identity-edge
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        lunanexa.io/role: management
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: "${OIDC_IDENTITY_EDGE_IMAGE}"
          imagePullPolicy: Never
          ports:
            - name: edge-https
              containerPort: 8443
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/lunanexa/tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: edge-https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: edge-https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: lunanexa-identity-edge-nginx
        - name: tls
          secret:
            secretName: lunanexa-oidc-ingress-tls
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-identity-edge-direct-ip
spec:
  podSelector:
    matchLabels:
      app: lunanexa-identity-edge
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: lunanexa-identity-gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lunanexa-identity-gateway-from-direct-ip-edge
spec:
  podSelector:
    matchLabels:
      app: lunanexa-identity-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lunanexa-identity-edge
      ports:
        - protocol: TCP
          port: 8080
