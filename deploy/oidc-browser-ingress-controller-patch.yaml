apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunanexa-control
spec:
  template:
    metadata:
      labels:
        lunanexa.io/browser-identity-sidecar: enabled
    spec:
      containers:
        # This relay has no OIDC, UI, DNS, or external-network responsibility.
        # It accepts only signed identity exchange/registration requests on port 8081 and
        # forwards them to the controller over the pod loopback interface.
        - name: identity-relay
          image: "${OIDC_IDENTITY_GATEWAY_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: identity-http
              containerPort: 8081
          env:
            - name: LUNANEXA_IDENTITY_GATEWAY_MODE
              value: relay
            - name: LUNANEXA_LISTEN_ADDRESS
              value: 0.0.0.0:8081
            - name: LUNANEXA_CONTROL_ENDPOINT
              value: http://127.0.0.1:8080
            - name: LUNANEXA_IDENTITY_EXCHANGE_PATH
              value: /v1/auth/session:exchange
            - name: LUNANEXA_IDENTITY_REGISTRATION_PATH
              value: /v1/auth/register
            - name: LUNANEXA_RELAY_ALLOWED_METHOD
              value: POST
            - name: LUNANEXA_RELAY_MAXIMUM_BODY_BYTES
              value: "256"
            - name: LUNANEXA_RELAY_REQUIRED_CONTENT_TYPE
              value: application/json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: identity-relay-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: identity-http
          livenessProbe:
            httpGet:
              path: /health
              port: identity-http
      volumes:
        - name: identity-relay-tmp
          emptyDir: {}
