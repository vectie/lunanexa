apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-control
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-node
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-console
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-workbench
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-model-source
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lunanexa-coursebook-public
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lunanexa-control-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lunanexa-model-source-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-control-config
data:
  controller-epoch: "${CONTROLLER_EPOCH}"
  runtime-endpoint: "${RUNTIME_ENDPOINT}"
  runtime-version: "${RUNTIME_VERSION}"
  runtime-image-digest: "${RUNTIME_IMAGE_DIGEST}"
  model-artifact-digest: "${MODEL_ARTIFACT_DIGEST}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-runtime-endpoints
data:
  endpoints.json: |
    ${RUNTIME_ENDPOINTS_JSON}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-node-config
data:
  controller-endpoint: "${CONTROLLER_ENDPOINT}"
  artifact-endpoint: "${ARTIFACT_ENDPOINT}"
  s3-region: "${S3_REGION}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunanexa-admin-settings
data:
  admin-settings.json: |
    {
      "schema_version":"lunanexa.settings.v1",
      "generation":"1",
      "control_timing":{"heartbeat_timeout_ms":"15000","heartbeat_replay_window_ms":"60000","provider_callback_replay_window_ms":"300000","lease_observation_replay_window_ms":"60000","artifact_transfer_grant_lifetime_ms":"300000","bootstrap_token_max_lifetime_ms":"900000","node_certificate_lifetime_ms":"3600000","node_certificate_renewal_lead_ms":"300000","node_reconcile_interval_ms":5000,"materialization_heartbeat_interval_ms":3000,"lease_receipt_stale_after_ms":"45000","workspace_reservation_max_lifetime_ms":"86400000"},
      "request_budgets":{"maximum_request_body_bytes":1048576,"response_cache_entries":1024,"openai_default_deadline_ms":"120000","openai_max_deadline_ms":"120000","openai_default_output_units":1024,"openai_max_output_units":131072,"openai_max_input_units":1048576,"openai_max_accelerator_memory_mib":1048576,"runtime_stream_event_bytes":1048576,"runtime_stream_total_bytes":16777216},
      "scheduler":{"admission_capacity":128,"runtime_concurrency":4,"retry_attempts":2,"background_capacity_percent":75,"normal_capacity_percent":90,"warm_model_weight":10000,"headroom_weight":1,"queue_weight":2,"reliability_weight":1,"utilization_weight":1},
      "retention":{"scheduler_decision_entries":1024,"telemetry_sample_entries":10000,"benchmark_run_entries":256},
      "node_runtime":{"container_pid_limit":512,"artifact_io_chunk_bytes":1048576,"signature_artifact_maximum_bytes":"1048576"},
      "telemetry_safety":{"maximum_sensor_rows":1024,"maximum_sensor_row_characters":512,"maximum_memory_mib":1000000000.0,"maximum_accelerator_count":1024.0,"maximum_temperature_celsius":200.0,"maximum_power_watts":100000.0}
    }
