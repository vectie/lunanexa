# The public ComfyUI pod delegates MiniMax-H3 work to the existing internal
# operator proxy. Port 8081 injects the runtime credential; workflows do not
# contain the credential or reach the model service directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comfyui-acceptance-egress
  namespace: aigc-acceptance-20260915
spec:
  podSelector:
    matchLabels:
      app: comfyui-acceptance
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.2.175/32
      ports:
        - protocol: TCP
          port: 4174
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
