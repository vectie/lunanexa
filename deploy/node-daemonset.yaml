# Host-filesystem cluster layout -- NOT what this cluster runs.
#
# This DaemonSet reads its per-node credentials and inventory from hostPath
# /etc/lunanexa, so it needs each compute host to be provisioned over ssh
# before it is applied. The deployed cluster layout instead keeps the per-node
# inventory and runtime configuration in ConfigMaps and renders one Deployment
# per node; that is what deploy/cluster/one-click.sh produces, and it is the
# single supported path for this cluster. See deploy/cluster/README.md.
#
# Kept because it is a valid alternative for a host-provisioned install, not
# because anything applies it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lunanexa-node
spec:
  selector:
    matchLabels:
      app: lunanexa-node
  template:
    metadata:
      labels:
        app: lunanexa-node
        app.kubernetes.io/part-of: lunanexa
        lunanexa.io/plane: node-agent
    spec:
      serviceAccountName: lunanexa-managed-node
      automountServiceAccountToken: false
      hostPID: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-agent
          image: registry.invalid/lunanexa/node@${NODE_IMAGE_DIGEST}
          env:
            - name: LUNANEXA_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-node-config
                  key: controller-endpoint
            - name: LUNANEXA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LUNANEXA_ADMIN_SETTINGS_PATH
              value: /etc/lunanexa/admin-policy/admin-settings.json
            - name: LUNANEXA_NODE_INVENTORY_PATH
              value: /etc/lunanexa/inventory.json
            - name: LUNANEXA_NODE_STATE_PATH
              value: /var/lib/lunanexa/node-state.json
            - name: LUNANEXA_NODE_CERTIFICATE_PATH
              value: /var/lib/lunanexa/node-certificate.json
            - name: LUNANEXA_LEASE_STATE_PATH
              value: /var/lib/lunanexa/exclusive-lease-agent.json
            # Kubernetes exclusive leases remain fail-closed until a
            # deployment-owned, exercised privileged adapter is installed.
            # The bundled sudo client is supported only by the host-systemd
            # layout and is deliberately not claimed runnable in this pod.
            - name: LUNANEXA_EXCLUSIVE_LEASES_ENABLED
              value: "0"
            - name: LUNANEXA_MODEL_CACHE_PATH
              value: /var/lib/lunanexa/models
            - name: LUNANEXA_ARTIFACT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-node-config
                  key: artifact-endpoint
            # Production nodes fetch model objects directly from the
            # Moongate-routed S3-compatible endpoint. The runtime container
            # never receives these credentials.
            - name: LUNANEXA_ARTIFACT_TRANSPORT
              value: s3-sigv4
            - name: LUNANEXA_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: lunanexa-node-config
                  key: s3-region
            - name: LUNANEXA_S3_ACCESS_KEY_ID_PATH
              value: /etc/lunanexa/s3-access-key-id
            - name: LUNANEXA_S3_SECRET_ACCESS_KEY_PATH
              value: /etc/lunanexa/s3-secret-access-key
            - name: LUNANEXA_S3_SESSION_TOKEN_PATH
              value: /etc/lunanexa/s3-session-token
            - name: LUNANEXA_NVIDIA_SMI_BINARY
              value: /usr/bin/nvidia-smi
            - name: LUNANEXA_ARTIFACT_MAX_SIZE_BYTES
              value: "1099511627776"
            - name: LUNANEXA_COSIGN_BINARY
              value: /usr/bin/cosign
            - name: LUNANEXA_COSIGN_PUBLIC_KEY_PATH
              value: /etc/lunanexa/cosign.pub
            - name: LUNANEXA_NODE_PUBLIC_KEY_REF
              value: host-ref:/etc/lunanexa/node-public-key
            - name: LUNANEXA_RUNTIME_BACKEND
              value: kubernetes
            - name: LUNANEXA_KUBERNETES_RUNTIME_CONFIG_PATH
              value: /etc/lunanexa/kubernetes-runtime.json
            - name: LUNANEXA_KUBERNETES_RUNTIME_STATE_PATH
              value: /var/lib/lunanexa/kubernetes-runtime-state.json
            - name: LUNANEXA_KUBERNETES_TOKEN_PATH
              value: /var/run/secrets/lunanexa-kubernetes/token
            - name: LUNANEXA_KUBERNETES_CA_PATH
              value: /var/run/secrets/lunanexa-kubernetes/ca.crt
            - name: LUNANEXA_NODE_TOKEN_PATH
              value: /etc/lunanexa/node-token
            - name: LUNANEXA_ASSIGNMENT_SIGNING_SECRET_PATH
              value: /etc/lunanexa/assignment-verification-key
            - name: LUNANEXA_BOOTSTRAP_TOKEN_ID_PATH
              value: /etc/lunanexa/bootstrap-token-id
            - name: LUNANEXA_BOOTSTRAP_TOKEN_PATH
              value: /etc/lunanexa/bootstrap-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: node-config
              mountPath: /etc/lunanexa
              readOnly: true
            - name: node-state
              mountPath: /var/lib/lunanexa
            - name: admin-settings
              mountPath: /etc/lunanexa/admin-policy
              readOnly: true
            - name: kubernetes-api
              mountPath: /var/run/secrets/lunanexa-kubernetes
              readOnly: true
      volumes:
        - name: node-config
          hostPath:
            path: /etc/lunanexa
            type: Directory
        - name: node-state
          hostPath:
            path: /var/lib/lunanexa
            type: DirectoryOrCreate
        - name: admin-settings
          configMap:
            name: lunanexa-admin-settings
        - name: kubernetes-api
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
