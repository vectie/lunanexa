apiVersion: apps/v1
kind: Deployment
metadata:
  name: lunanexa-control
spec:
  selector:
    matchLabels:
      app: lunanexa-control
  template:
    metadata:
      labels:
        app: lunanexa-control
    spec:
      containers:
        - name: control
          image: registry.example.test/lunanexa/control@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lunanexa-console-public
  annotations:
    lunanexa.io/exposure: ingress-only
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: lunanexa-identity-edge
  ports:
    - name: operator-https
      protocol: TCP
      port: 5003
      targetPort: edge-https
